name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  HOMONTO_REF: 00bc06a82ba520fa4853a7500ac2f4b6caefa00e

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: install homonto
        run: go install "github.com/Novirmor/homonto@${HOMONTO_REF}"
      - name: smoke the tagged tree
        run: scripts/smoke.sh local
      - name: pack
        run: scripts/pack.sh dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/pins.toml --title "$GITHUB_REF_NAME" --notes-file dist/pins.toml
      - name: smoke the published assets
        run: scripts/smoke.sh release "$GITHUB_REF_NAME"
